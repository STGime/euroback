##############################################################################
# Eurobase CI/CD — GitHub Actions
# Builds and deploys to Scaleway (FR jurisdiction only).
# Images go to Scaleway Container Registry (fr-par).
##############################################################################
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: rg.fr-par.scw.cloud
  REGISTRY_NS: eurobase-app
  # Closes #96. actions/checkout@v4, setup-go@v5, setup-node@v4
  # are pinned on Node 20 which GitHub deprecates on 2026-06-02
  # (auto-upgraded to Node 24) and removes on 2026-09-16. Opting
  # in to Node 24 now surfaces any incompatibility on CI runs
  # before the platform-wide cutover. Bump the action major
  # versions when each maintainer ships a Node-24-native release;
  # the env var becomes a no-op then.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # -------------------------------------------------------------------------
  # Sovereignty vendors — pin parity with marketing site
  # -------------------------------------------------------------------------
  #
  # The sovereignty-vendors dataset is consumed by TWO repos:
  #
  #   * This repo (euroback) — internal/sovereignty/data submodule,
  #     embedded at build time via //go:embed and used by the
  #     /platform/public/sovereignty/report endpoint.
  #   * Marketing site (STGime/eurobase) — src/data/sovereignty-vendors
  #     submodule, consumed by the picker + per-vendor SEO pages.
  #
  # If the two pins drift, the picker UI offers 112 vendors while
  # the backend only knows 11 — a real user-visible bug shipped 2026-09-14
  # (empty report pages for 7-vendor picks). This job enforces
  # parity: backend pin MUST match marketing pin. When adding vendors,
  # bump both in the same round.
  sovereignty-vendors-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No need for submodule contents — we only compare the pin.

      - name: Compare submodule pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # This repo's pinned SHA for internal/sovereignty/data.
          BACKEND_SHA=$(git ls-tree HEAD internal/sovereignty/data | awk '{print $3}')

          # Marketing site's pinned SHA for src/data/sovereignty-vendors.
          # GitHub REST API `.sha` on a submodule tree entry is the pinned commit.
          MARKETING_SHA=$(gh api \
            repos/STGime/eurobase/contents/src/data/sovereignty-vendors \
            --jq .sha)

          echo "backend    (euroback)    : $BACKEND_SHA"
          echo "marketing  (eurobase)    : $MARKETING_SHA"

          if [ "$BACKEND_SHA" = "$MARKETING_SHA" ]; then
            echo "::notice::sovereignty-vendors pins match"
            exit 0
          fi

          echo "::error::sovereignty-vendors pin mismatch — backend and marketing site are pointing at different snapshots of the dataset."
          echo ""
          echo "To fix, bump this repo's submodule to match marketing:"
          echo ""
          echo "    git submodule update --remote internal/sovereignty/data"
          echo "    git add internal/sovereignty/data"
          echo "    git commit -m 'Sovereignty: bump vendor data to match marketing pin'"
          echo ""
          echo "OR if marketing is the one behind, bump marketing first."
          exit 1

  # -------------------------------------------------------------------------
  # Go tests
  # -------------------------------------------------------------------------
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # sovereignty-vendors is a submodule at
        # internal/sovereignty/data — the sovereignty package
        # embeds its YAMLs via //go:embed and won't build without
        # the files present. `recursive` is future-proof (no
        # nested submodules today).
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test ./... -v -race

      - name: Vet
        run: go vet ./...

  # -------------------------------------------------------------------------
  # Console (SvelteKit) build check
  # -------------------------------------------------------------------------
  test-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          cd console
          npm ci --include=optional
          npm run build
        env:
          PUBLIC_API_URL: https://api.eurobase.app
          PUBLIC_BUILD_SHA: ${{ github.sha }}

      # svelte-check disabled — too many strict TS warnings from route params.
      # TODO: fix string|undefined params across console pages, then re-enable.
      # - name: Lint
      #   run: |
      #     cd console
      #     npm run check --if-present

  # -------------------------------------------------------------------------
  # Functions runner (Deno) tests — sandbox isolation + ctx.vault.get path
  # -------------------------------------------------------------------------
  test-functions-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        # --no-check: skip type-checking remote std imports (slow, not what
        # this job is for — Docker build catches type errors at image-build
        # time). --unstable-worker-options: needed for sandbox_test.ts
        # which exercises the `Worker { deno: { permissions: 'none' } }`
        # API the runtime relies on. Permissions: read for blob-URL worker
        # bootstrap, env so vault_test can set/clear VAULT_ENCRYPTION_KEY,
        # net for the std assert imports.
        run: deno test --no-check --unstable-worker-options --allow-read --allow-env --allow-net functions-runner/

  # -------------------------------------------------------------------------
  # MCP server build check
  # -------------------------------------------------------------------------
  test-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          cd mcp-server
          npm ci
          npm run build

  # -------------------------------------------------------------------------
  # Build & push images, then deploy to Kapsule
  # Only on main branch after tests pass.
  # -------------------------------------------------------------------------
  deploy:
    needs: [test-go, test-console, test-mcp, test-functions-runner]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys. Without this, back-to-back merges to main run
    # concurrent deploys that race on the migrate Job (delete → apply hits
    # "field is immutable" when another run recreates it in between) and
    # last-writer-wins on Deployment images regardless of commit order.
    # cancel-in-progress stays false — killing a deploy mid-kubectl could
    # leave a half-applied rollout.
    #
    # CAUTION (2026-06-11 merge train): GitHub supersedes the *previously
    # pending* job when a new one enters the group, but entry order is when
    # each run's deploy job gets scheduled (tests + runner availability),
    # NOT commit order. With several rapid merges the newest commit's
    # deploy can be the one cancelled, leaving an older commit to deploy
    # last. The freshness guard below is the safety net: a deploy whose
    # commit is no longer the tip of main skips itself instead of
    # regressing production.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Freshness guard — runs AFTER the concurrency queue admits this job,
      # so it sees any commits that landed while we waited. If main has
      # moved on, every following step is skipped (the run ends green with
      # a notice). If the newer commit's own run was cancelled by the
      # concurrency group, nothing deploys it automatically — re-run that
      # run's deploy job (`gh run rerun <id> --failed`); production stays
      # on the previous good deploy until then.
      #
      # NOTE for future edits: every step added to this job MUST carry
      #   if: steps.fresh.outputs.stale != 'true'
      # A job-level gate (separate freshness job) would NOT work — it
      # would run before this job enters the concurrency queue, missing
      # commits that land during a 5-10 min wait behind another deploy.
      # The per-step condition is the price of checking post-admission.
      - name: Check this commit is still the tip of main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "tip=$tip" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to ${tip} — skipping deploy of ${GITHUB_SHA}. If the newer commit's run was cancelled by the concurrency group, re-run it: gh run rerun <run-id> --failed"
          fi

      # A skipped stale run ends green, so without this ping nobody
      # notices when the tip itself ended up undeployed (its run
      # cancelled by the concurrency group while older runs skipped).
      - name: Notify Discord — stale deploy skipped
        if: ${{ steps.fresh.outputs.stale == 'true' && env.WEBHOOK != '' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          TIP: ${{ steps.fresh.outputs.tip }}
        run: |
          payload=$(jq -n \
            --arg title "⏭️ Deploy skipped (stale commit)" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg desc "\`${GITHUB_SHA:0:7}\` was no longer the tip of main (now \`${TIP:0:7}\`) — deploy skipped. Check that the tip's own run deployed; if it was cancelled, rerun it: \`gh run rerun <id> --failed\`" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15105570}]}')
          curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$payload" \
            || echo "::warning::Discord stale-skip notification failed"

      - uses: actions/checkout@v4
        if: steps.fresh.outputs.stale != 'true'
        # The gateway image embeds internal/sovereignty/data via
        # //go:embed — that path is a git submodule pointing at
        # sovereignty-vendors. Docker's build context needs the
        # files present or `go build` fails with
        # `pattern data/vendors/*.yaml: no matching files found`.
        with:
          submodules: recursive

      - name: Login to Scaleway Registry
        if: steps.fresh.outputs.stale != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push gateway
        if: steps.fresh.outputs.stale != 'true'
        run: |
          docker build \
            -f deploy/docker/Dockerfile.gateway \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/gateway:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/gateway:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/gateway:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/gateway:latest

      - name: Build and push worker
        if: steps.fresh.outputs.stale != 'true'
        run: |
          docker build \
            -f deploy/docker/Dockerfile.worker \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/worker:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/worker:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/worker:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/worker:latest

      - name: Build and push console
        if: steps.fresh.outputs.stale != 'true'
        run: |
          docker build \
            -f deploy/docker/Dockerfile.console \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/console:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/console:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/console:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/console:latest

      - name: Build and push functions runner
        if: steps.fresh.outputs.stale != 'true'
        run: |
          docker build \
            -f deploy/docker/Dockerfile.fn \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/functions:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/functions:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/functions:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/functions:latest

      - name: Build and push MCP server
        if: steps.fresh.outputs.stale != 'true'
        run: |
          docker build \
            -f mcp-server/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/mcp-server:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/mcp-server:latest \
            mcp-server/
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/mcp-server:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/mcp-server:latest

      # The pooler image is tagged by the content of its inputs, so a deploy
      # that doesn't touch them leaves the tag — and the running pooler,
      # which carries live tenant traffic — unchanged (no restart).
      - name: Build and push pgbouncer
        id: pgb
        if: steps.fresh.outputs.stale != 'true'
        run: |
          # ISO week in the hash: the image (alpine + PgBouncer security
          # fixes) is rebuilt at least weekly, even if no input changed.
          TAG=pgb-$( { git ls-files -s deploy/docker/Dockerfile.pgbouncer cmd/pgbouncer-userlist \
                         internal/pgbouncerconf internal/tenantlogin go.mod go.sum; date -u +%G-W%V; } \
                   | sha256sum | cut -c1-16)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IMG=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/pgbouncer
          if docker manifest inspect "$IMG:$TAG" >/dev/null 2>&1; then
            echo "pgbouncer image $TAG already in the registry — not rebuilding"
          else
            docker build -f deploy/docker/Dockerfile.pgbouncer -t "$IMG:$TAG" .
            docker push "$IMG:$TAG"
          fi

      - name: Build and push migrations image
        if: steps.fresh.outputs.stale != 'true'
        run: |
          docker build \
            -f deploy/docker/Dockerfile.migrations \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/migrations:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/migrations:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/migrations:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/migrations:latest

      - name: Install kubectl
        if: steps.fresh.outputs.stale != 'true'
        uses: azure/setup-kubectl@v4

      - name: Install Scaleway CLI and get kubeconfig
        if: steps.fresh.outputs.stale != 'true'
        run: |
          curl -sL -o /usr/local/bin/scw https://github.com/scaleway/scaleway-cli/releases/download/v2.53.0/scaleway-cli_2.53.0_linux_amd64
          chmod +x /usr/local/bin/scw
          scw version
          mkdir -p ~/.kube
          scw k8s kubeconfig install ${{ secrets.SCW_CLUSTER_ID }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1

      - name: Apply K8s manifests (security, ingress, functions, MCP server)
        if: steps.fresh.outputs.stale != 'true'
        run: |
          # CVE-2026-31431 (Copy Fail), CVE-2026-46333 (ssh-keysign-pwn),
          # and CVE-2026-43284 (Dirty Frag) mitigations must land before any
          # pod restart so newly scheduled pods can't briefly run on a node
          # with algif_aead loaded, unprivileged ptrace enabled, or
          # esp4 / esp6 / rxrpc loaded. All three DaemonSets also self-apply
          # to autoscaler-brought-up nodes between rotations.
          kubectl apply -f deploy/k8s/security/disable-algif-aead.yaml
          kubectl apply -f deploy/k8s/security/disable-ptrace.yaml
          kubectl apply -f deploy/k8s/security/disable-dirty-frag.yaml
          # In-cluster Redis replaces managed RED1-micro to cut the
          # beta-stage bill (~€59/mo). Apply before the gateway/worker
          # rollout so REDIS_URL=redis://redis.eurobase.svc.cluster.local
          # resolves the first time those pods start. See
          # docs/runbooks/cost-tier.md.
          kubectl apply -f deploy/k8s/redis.yaml
          kubectl apply -f deploy/k8s/ingress.yaml
          # All Deployment manifests get applied so changes to replicas,
          # resources, probes, env, etc. propagate via the normal deploy.
          #
          # Images: the manifests say `:latest`, which is THIS build (pushed
          # above). Client-side apply patches the live object to match, so
          # applying `:latest` here would start the new code BEFORE the
          # migrations below. apply_pinned rewrites each image to the one
          # currently running, so this step changes config only; the new sha
          # arrives via `kubectl set image` in "Deploy to Kapsule", after
          # migrations. (First-ever create: no live object, `:latest` it is.)
          apply_pinned() { # <manifest> <deployment> <container>
            if [ -z "$(kubectl -n eurobase get deployment "$2" --ignore-not-found -o name)" ]; then
              kubectl apply -f "$1" # first-ever create
              return
            fi
            live=$(kubectl -n eurobase get deployment "$2" -o jsonpath="{.spec.template.spec.containers[?(@.name==\"$3\")].image}")
            # Exists but no image read (API hiccup, renamed container):
            # stop rather than silently applying :latest before migrations.
            [ -n "$live" ] || { echo "apply_pinned: no image for container $3 in deployment/$2"; exit 1; }
            sed -E "s#${REGISTRY}/${REGISTRY_NS}/[a-z-]+:latest#${live}#g" "$1" | kubectl apply -f -
          }
          # #653: RBAC + the published-userlist Secret, and the worker's
          # SA/env (image pinned; the new worker starts in "Deploy to
          # Kapsule", where it publishes before the poolers roll).
          kubectl apply -f deploy/k8s/pgbouncer-userlist-rbac.yaml
          apply_pinned deploy/k8s/worker.yaml worker worker
          apply_pinned deploy/k8s/gateway.yaml gateway gateway
          apply_pinned deploy/k8s/console.yaml console console
          # NetworkPolicy must apply BEFORE the pod rollout so the new
          # net-allowed worker permissions never have a window of
          # reaching cluster-internal IPs.
          kubectl apply -f deploy/k8s/functions-networkpolicy.yaml
          apply_pinned deploy/k8s/functions.yaml functions deno-runner
          apply_pinned deploy/k8s/mcp-server.yaml mcp-server mcp-server
          # Health monitor → Discord #alerts. Reads DISCORD_ALERTS_WEBHOOK
          # from eurobase-secrets (optional key); no-ops if it's unset.
          kubectl apply -f deploy/k8s/health-monitor-cronjob.yaml
          # TLS cert monitor → Discord #alerts. Reads the same
          # DISCORD_ALERTS_WEBHOOK secret. Warns when the served cert
          # has < 14 days left (day 76 of a 90-day Let's Encrypt cert —
          # 16 days after cert-manager's day-60 renewal should have
          # happened), pages at expiry. Runs hourly. Its absence is
          # what caused the silent 2026-09-23 *.eurobase.app outage
          # (30-day-stuck day-60 renewal that no one saw fail) — see
          # issue #625.
          kubectl apply -f deploy/k8s/cert-monitor-cronjob.yaml

      - name: Run database migrations
        if: steps.fresh.outputs.stale != 'true'
        run: |
          # Job specs are largely immutable — delete any prior instance so
          # this deploy's image gets picked up. --ignore-not-found covers the
          # first-ever run. --cascade=foreground waits for the Job object
          # (and its pods) to be fully removed from the API before the
          # next command runs — without it, the subsequent `apply` raced
          # the background reaper and hit `field is immutable` on the
          # spec.template (PR #107's deploy failed that way).
          kubectl -n eurobase delete job migrate --ignore-not-found --cascade=foreground
          sed "s|eurobase-app/migrations:latest|eurobase-app/migrations:${{ github.sha }}|" \
            deploy/k8s/migrate-job.yaml | kubectl apply -f -
          # Block the rollout on a successful migration. If it fails, bail
          # before touching the gateway — the old gateway keeps running on
          # the old schema.
          kubectl -n eurobase wait --for=condition=complete --timeout=300s job/migrate \
            || (kubectl -n eurobase logs job/migrate --tail=200; exit 1)

      - name: Deploy to Kapsule
        if: steps.fresh.outputs.stale != 'true'
        run: |
          # 1. Worker first (after migrations): it publishes the runner
          #    pooler's tenant userlist (#653). Wait for its first publish so
          #    new pooler pods never start without tenants (their init
          #    container also refuses to).
          kubectl set image deployment/worker \
            worker=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/worker:${{ github.sha }} \
            migrate=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/worker:${{ github.sha }} \
            -n eurobase
          kubectl rollout status deployment/worker -n eurobase --timeout=180s
          for i in $(seq 1 36); do
            [ -n "$(kubectl -n eurobase get secret pgbouncer-tenant-userlist -o jsonpath='{.data.upstream}')" ] && break
            sleep 5
          done
          [ -n "$(kubectl -n eurobase get secret pgbouncer-tenant-userlist -o jsonpath='{.data.upstream}')" ] \
            || { echo "worker never published the pgbouncer tenant userlist"; kubectl -n eurobase logs deployment/worker -c worker --tail=50; exit 1; }
          # 2. Poolers (content tag: unchanged inputs = no restart), healthy
          #    before the clients roll.
          for f in pgbouncer pgbouncer-gateway; do
            sed "s|eurobase-app/pgbouncer:latest|eurobase-app/pgbouncer:${{ steps.pgb.outputs.tag }}|" \
              deploy/k8s/$f.yaml | kubectl apply -f -
          done
          kubectl rollout status deployment/pgbouncer -n eurobase --timeout=180s
          kubectl rollout status deployment/pgbouncer-gateway -n eurobase --timeout=180s
          # 3. Everything else.
          kubectl set image deployment/gateway \
            gateway=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/gateway:${{ github.sha }} \
            -n eurobase
          kubectl set image deployment/console \
            console=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/console:${{ github.sha }} \
            -n eurobase
          kubectl set image deployment/functions \
            deno-runner=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/functions:${{ github.sha }} \
            -n eurobase
          kubectl set image deployment/mcp-server \
            mcp-server=${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/mcp-server:${{ github.sha }} \
            -n eurobase

      - name: Verify rollout
        if: steps.fresh.outputs.stale != 'true'
        run: |
          # In-cluster Redis goes first so rate-limiting + realtime fan-out
          # connect cleanly on gateway startup. Failure here is non-blocking
          # for the gateway (it logs a warning and disables those features),
          # but a clean roll keeps the failure paths out of the deploy log.
          kubectl rollout status statefulset/redis -n eurobase --timeout=120s
          kubectl rollout status daemonset/disable-ptrace -n kube-system --timeout=120s
          kubectl rollout status deployment/gateway -n eurobase --timeout=120s
          kubectl rollout status deployment/worker -n eurobase --timeout=120s
          kubectl rollout status deployment/console -n eurobase --timeout=120s
          kubectl rollout status deployment/functions -n eurobase --timeout=120s
          kubectl rollout status deployment/mcp-server -n eurobase --timeout=120s
          kubectl rollout status deployment/pgbouncer -n eurobase --timeout=120s
          kubectl rollout status deployment/pgbouncer-gateway -n eurobase --timeout=120s

      # ----------------------------------------------------------------------
      # Discord #deploys notifications. Configure the channel webhook URL as
      # the repo secret DISCORD_DEPLOY_WEBHOOK. Both steps no-op if it's unset.
      # ----------------------------------------------------------------------
      - name: Notify Discord — deploy succeeded
        if: ${{ success() && steps.fresh.outputs.stale != 'true' && env.WEBHOOK != '' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          payload=$(jq -n \
            --arg title "✅ Deploy succeeded" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg desc "\`${GITHUB_SHA:0:7}\` deployed to production by ${{ github.actor }}." \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 3066993}]}')
          # Never let a Discord hiccup flip a good deploy to failed (which would
          # also trip the failure-notify step below). Warn, don't fail.
          curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$payload" \
            || echo "::warning::Discord deploy notification failed"

      - name: Notify Discord — deploy failed
        if: ${{ failure() && env.WEBHOOK != '' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          payload=$(jq -n \
            --arg title "❌ Deploy failed" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg desc "\`${GITHUB_SHA:0:7}\` by ${{ github.actor }} failed. [View run logs →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15158332}]}')
          curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$payload" \
            || echo "::warning::Discord deploy notification failed"
