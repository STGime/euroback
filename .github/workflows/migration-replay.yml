name: Migration replay

# Replays EVERY migration, in order, on a fresh PostgreSQL 16 with the
# production role shapes and the same golang-migrate CLI image as the prod
# migrate Job (#632). Catches migrations that only "work" on prod because
# of hand-applied state — the class of bug that broke 000044/45/52/89 for
# any freshly built database (new env, DR rebuild, local dev). On PRs it
# also checks new migrations are numbered above main's highest version.
#
# Path-filtered: don't make this a *required* check without dropping the
# filter, or unrelated PRs will wait on it forever.

on:
  pull_request:
    paths:
      - migrations/**
      - scripts/db/**
      - scripts/replay-migrations.sh
      - deploy/docker/Dockerfile.migrations
      - .github/workflows/migration-replay.yml
  push:
    branches: [main]
    paths:
      - migrations/**
      - scripts/db/**
      - scripts/replay-migrations.sh
      - deploy/docker/Dockerfile.migrations
      - .github/workflows/migration-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Built-in superuser must not be eurobase_api (000037 REASSIGNs it).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: replay-ci-ephemeral
          POSTGRES_DB: eurobase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eurobase"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the order check diffs against the base branch

      - name: New migrations are numbered above main
        if: github.event_name == 'pull_request'
        run: scripts/db/check-migration-order.sh "origin/${{ github.base_ref }}"

      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Replay all migrations
        env:
          PGURL: postgres://postgres:replay-ci-ephemeral@localhost:5432/eurobase?sslmode=disable
        run: scripts/replay-migrations.sh
