<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Eurobase brand mark — stacked wordmark, 512×512, transparent background.
       Light-background variant (navy "euro" + gold "base"): designed for use on
       white or light neutral surfaces (directory listings, social bios, GitHub
       README, favicons at scale). For dark backgrounds, swap the "euro" fill
       to #FFFFFF. Colors match /public/favicon.png.

       Layout tuned for ≥85% vertical fill so the mark reads at 16×16 (browser
       tab bar) with weight comparable to peer icons. Trebuchet-MS bold at
       size 200 keeps ~54px horizontal margin — safe under most substitutions.
       PNG variant is rendered from the same parameters via ImageMagick so the
       raster + vector paths look identical. -->
  <text x="256" y="260"
        font-family="'Trebuchet MS', Trebuchet, Verdana, Helvetica, sans-serif"
        font-weight="bold"
        font-size="200"
        text-anchor="middle"
        fill="#0A1929">euro</text>
  <text x="256" y="450"
        font-family="'Trebuchet MS', Trebuchet, Verdana, Helvetica, sans-serif"
        font-weight="bold"
        font-size="200"
        text-anchor="middle"
        fill="#FFB300">base</text>
</svg>
