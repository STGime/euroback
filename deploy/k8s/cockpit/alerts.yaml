##############################################################################
# Scaleway Cockpit — Recommended alert rules
#
# These rules are written in standard Prometheus / Grafana managed-alerting
# syntax. Load them into Scaleway Cockpit via:
#
#   1. Grafana UI → Alerting → Alert rules → New rule → Import
#   2. OR via Grafana HTTP API: POST /api/ruler/grafana/api/v1/rules/eurobase
#   3. OR via Terraform with the grafana/grafana provider (resource:
#      grafana_rule_group).
#
# They target the `cockpit` datasource (the managed Prometheus fed by Alloy).
#
# Notification policy: configure a contact point in Cockpit (email is the
# lowest-friction; SMTP relays inside the EU are fine — Scaleway TEM itself
# works). Avoid PagerDuty / Opsgenie / Slack US SaaS if you want to stay on
# the EU sovereignty path.
##############################################################################
groups:
  - name: eurobase-gateway
    interval: 1m
    rules:

      # ── Availability ─────────────────────────────────────────────────────
      - alert: GatewayDown
        expr: up{app="gateway"} == 0
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "Gateway pod {{ $labels.pod }} is down"
          description: |
            Alloy has failed to scrape {{ $labels.pod }} for 2+ minutes.
            Either the pod is crash-looping or the metrics port is unreachable.
            Check: kubectl -n eurobase get pods -l app=gateway

      - alert: GatewayAllReplicasDown
        expr: absent(up{app="gateway"} == 1)
        for: 1m
        labels:
          severity: critical
          service: gateway
          pager: "true"
        annotations:
          summary: "No gateway replicas are reachable"
          description: "Every gateway replica is failing scrape. The API is likely down. This should page immediately."

      # ── Error rate ───────────────────────────────────────────────────────
      - alert: GatewayHigh5xxRate
        expr: |
          (
            sum(rate(eurobase_http_requests_total{status="5xx"}[5m]))
            /
            sum(rate(eurobase_http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "Gateway 5xx error rate above 1%"
          description: |
            5xx rate is {{ $value | humanizePercentage }} over the last 5 minutes.
            Inspect logs: kubectl -n eurobase logs -l app=gateway --tail=200
            Dashboard: Cockpit → Gateway → Errors

      - alert: GatewayCritical5xxRate
        expr: |
          (
            sum(rate(eurobase_http_requests_total{status="5xx"}[5m]))
            /
            sum(rate(eurobase_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          service: gateway
          pager: "true"
        annotations:
          summary: "Gateway 5xx error rate above 5%"
          description: "5xx rate is {{ $value | humanizePercentage }} — users are seeing errors."

      # ── Latency ──────────────────────────────────────────────────────────
      - alert: GatewayHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route) (rate(eurobase_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "p95 latency on {{ $labels.route }} > 1s"
          description: "Route {{ $labels.route }} p95 is {{ $value }}s over the last 5 minutes."

      # ── Saturation ───────────────────────────────────────────────────────
      - alert: GatewayHighInFlight
        expr: avg(eurobase_http_requests_in_flight) > 200
        for: 5m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "Gateway is handling {{ $value }} concurrent requests (avg)"
          description: "Sustained concurrency above 200; consider scaling replicas."

      - alert: GatewayPanicSpike
        expr: increase(eurobase_http_panics_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "Gateway recovered from a panic"
          description: "Any panic is worth investigating — check logs for the stack trace."

      # ── Resource exhaustion ──────────────────────────────────────────────
      - alert: GatewayGoroutineLeak
        expr: go_goroutines{app="gateway"} > 5000
        for: 15m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "Goroutine count on {{ $labels.pod }} = {{ $value }}"
          description: "Possible goroutine leak; take a pprof snapshot."

      - alert: GatewayHighMemory
        expr: |
          process_resident_memory_bytes{app="gateway"}
          / on(pod) kube_pod_container_resource_limits{resource="memory", container="gateway"}
          > 0.9
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "{{ $labels.pod }} memory > 90% of limit"
          description: "Container is close to OOMKill; investigate or raise limits."

  # ═══════════════════════════════════════════════════════════════════════
  # Mollie billing webhook health
  # ═══════════════════════════════════════════════════════════════════════
  #
  # POST /platform/billing/webhook always returns HTTP 200 to Mollie
  # (retry-storm avoidance — non-2xx would put the webhook into
  # Mollie's exponential-backoff retry queue). That's the right call
  # operationally but it means slog.Error("billing.webhook.failed",
  # ...) is the only signal a webhook actually broke. This alert
  # counts them via the Prometheus counter incremented alongside
  # the slog line — 5 failures in 10 min pages ops. See
  # docs/billing/webhook-state-machine.md for the trust model.
  - name: eurobase-billing
    interval: 1m
    rules:

      - alert: BillingWebhookFailingSpike
        expr: |
          sum(increase(eurobase_billing_webhook_failed_total[10m])) > 5
        for: 2m
        labels:
          severity: warning
          service: billing
        annotations:
          summary: "Mollie webhook failing — {{ $value | printf \"%.0f\" }} failures in the last 10 min"
          description: |
            The gateway hit >5 unrecoverable failures processing Mollie webhooks
            in the last 10 min. Every one returned 200 to Mollie (see docs) so
            Mollie will NOT retry — payment / subscription state is drifting
            away from Mollie's view of the world.
            Check: kubectl -n eurobase logs -l app=gateway | grep billing.webhook.failed

      - alert: BillingWebhookFailingSustained
        expr: |
          sum(rate(eurobase_billing_webhook_failed_total[30m])) > 0
        for: 30m
        labels:
          severity: critical
          service: billing
          pager: "true"
        annotations:
          summary: "Mollie webhook has been failing for 30+ minutes"
          description: |
            Any sustained non-zero webhook-failure rate for 30 min likely
            means an outright bug in the state machine (Mollie API change,
            missing metadata, DB drift). Page immediately.

  # ── PgBouncer (#641 / #651) ──────────────────────────────────────────────
  # Metrics from the pgbouncer-userlist sidecar (:9127) on both poolers:
  # app="pgbouncer" (functions runner, tenant traffic) and
  # app="pgbouncer-gateway" (gateway, from PR 4).
  - name: eurobase-pgbouncer
    interval: 1m
    rules:
      - alert: PgBouncerDown
        expr: up{app=~"pgbouncer|pgbouncer-gateway"} == 0 or pgbouncer_up == 0
        for: 2m
        labels:
          severity: critical
          service: pgbouncer
        annotations:
          summary: "PgBouncer {{ $labels.app }} pod {{ $labels.pod }} is down or its admin console is unreachable"
          description: "Check: kubectl -n eurobase get pods -l app={{ $labels.app }}; kubectl -n eurobase logs {{ $labels.pod }} -c pgbouncer"

      # Gateway pooler: any sustained queue affects every tenant's API calls.
      - alert: PgBouncerGatewayClientsWaiting
        expr: max by (app, database) (pgbouncer_clients_waiting{app="pgbouncer-gateway"}) > 0
        for: 2m
        labels:
          severity: warning
          service: pgbouncer
        annotations:
          summary: "Gateway clients queueing for a server connection ({{ $labels.database }})"
          description: "The gateway's pool is too small or held by long transactions. Check pgbouncer_maxwait_seconds."

      - alert: PgBouncerGatewayLongWait
        expr: max by (app, database) (pgbouncer_maxwait_seconds{app="pgbouncer-gateway"}) > 5
        for: 1m
        labels:
          severity: warning
          service: pgbouncer
        annotations:
          summary: "A gateway client has waited > 5 s for a server connection"

      # Runner pooler: one busy tenant filling its own 2-connection pool
      # shows up here too, so only sustained queueing is worth a look.
      - alert: PgBouncerRunnerClientsWaiting
        expr: max by (app, database) (pgbouncer_clients_waiting{app="pgbouncer"}) > 0
        for: 15m
        labels:
          severity: info
          service: pgbouncer
        annotations:
          summary: "Function (tenant) clients have been queueing for 15+ minutes"
          description: |
            Usually one tenant holding its pool with long transactions (its
            functions get "database is busy"). If many tenants are affected,
            raise PGB_TENANT_MAX_DB_CONNECTIONS within the budget.

      - alert: PgBouncerClientSlotsHigh
        expr: max by (app, pod) (pgbouncer_client_connections / pgbouncer_max_client_conn) > 0.8
        for: 5m
        labels:
          severity: warning
          service: pgbouncer
        annotations:
          summary: "{{ $labels.app }} pod {{ $labels.pod }} uses > 80% of max_client_conn"
          description: |
            On the runner's pooler this can mean tenant code is opening raw
            sockets to 6432 (it can't log in, but occupies slots) — find the
            source function in the runner logs; on the gateway's pooler it
            means gateway client pools are oversized.

      # The worker republishes the runner pooler's tenant userlist at least
      # every 5 min (#653); older means its publisher is down or
      # misconfigured and new projects can't use ctx.db.sql.
      - alert: PgBouncerUserlistStale
        expr: max by (pod) (pgbouncer_userlist_published_age_seconds{app="pgbouncer"}) > 900
        for: 5m
        labels:
          severity: warning
          service: pgbouncer
        annotations:
          summary: "Runner pooler's tenant userlist not republished for 15+ minutes"
          description: "Check the worker logs for 'pgbouncer userlist publish'; kubectl -n eurobase get secret pgbouncer-tenant-userlist."
