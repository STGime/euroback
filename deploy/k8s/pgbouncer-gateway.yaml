# PgBouncer for the gateway — separate from the runner's pooler
# (pgbouncer.yaml) so client capacity reachable from tenant function code
# is never the gateway's: only gateway pods may connect.
#
# Serves tenant `<schema>_func` roles for the gateway's customer-SQL path
# (SDK SQL / data API on per-project logins — security remediation). Same
# proven shape as the runner's pooler: tenant roles only, NO secrets in the
# pod — the worker publishes the SCRAM verifiers + upstream to the Secret
# pgbouncer-tenant-userlist, which this pooler reads via a projected
# service-account token. No FUNC_PASSWORD_SECRET, no DB URL here.
#
# The gateway's own platform pools (eurobase_gateway / developer) stay as
# direct connections for now; pooling those is a later, separate change.
#
# Budget: counted against FuncConnLimit together with the runner's pooler —
# replicas × PGB_TENANT_POOL_SIZE here + PGB_PEER_TENANT_CONNECTIONS (the
# runner's) + DirectFuncConnections ≤ FuncConnLimit (pgbouncerconf.
# CheckTenantBudget, asserted at startup). Keep PGB_REPLICAS = spec.replicas
# and PGB_PEER_TENANT_CONNECTIONS = the runner's replicas × its pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-gateway
  namespace: eurobase
  labels:
    app: pgbouncer-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer-gateway
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: pgbouncer-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pgbouncer-gateway
      automountServiceAccountToken: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: render
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer-userlist", "init"]
          env: &pgbEnv
            # Tenant roles only, from the worker-published Secret (read-only
            # via the projected service-account token). No platform roles,
            # no FUNC_PASSWORD_SECRET, no DB URL in this pod.
            - name: PGB_TENANT_SOURCE
              value: k8s-secret:pgbouncer-tenant-userlist
            - name: PGB_PLATFORM_URL_VARS
              value: ""
            - name: PGB_DIR
              value: /run/pgbouncer
            - name: PGB_SERVER_TLS
              value: require
            # Platform alias serves no role here (only the stats user).
            - name: PGB_MAX_DB_CONNECTIONS
              value: "1"
            - name: PGB_TENANT_MAX_DB_CONNECTIONS
              value: "15"
            - name: PGB_TENANT_POOL_SIZE
              value: "2"
            # Keep equal to spec.replicas (tenant connection budget check).
            - name: PGB_REPLICAS
              value: "2"
            # The runner pooler's tenant share (its replicas × pool = 2 × 2),
            # so this pooler's budget check accounts for both poolers.
            - name: PGB_PEER_TENANT_CONNECTIONS
              value: "4"
          volumeMounts: &saMounts
            - { name: run, mountPath: /run/pgbouncer }
            - { name: sa, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: pgbouncer
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer", "/run/pgbouncer/pgbouncer.ini"]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5; kill -INT $(pidof pgbouncer); while pidof pgbouncer >/dev/null; do sleep 1; done"]
          ports:
            - { name: pgbouncer, containerPort: 6432 }
          readinessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6432 }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - { name: run, mountPath: /run/pgbouncer }
          securityContext: *restricted
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: userlist
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer-userlist", "sync"]
          ports:
            - { name: metrics, containerPort: 9127 }
          env: *pgbEnv
          volumeMounts: *saMounts
          securityContext: *restricted
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      imagePullSecrets:
        - name: scw-registry
      volumes:
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        # SA token for the render/userlist containers only (get on
        # pgbouncer-tenant-userlist) — not mounted into the pgbouncer
        # container. It only grants read of data pgbouncer already holds.
        - name: sa
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-gateway
  namespace: eurobase
  labels:
    app: pgbouncer-gateway
spec:
  selector:
    app: pgbouncer-gateway
  ports:
    - { name: pgbouncer, port: 6432, targetPort: 6432 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-gateway
  namespace: eurobase
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer-gateway
---
# Only the gateway (and the ops smoke test) may connect; Alloy scrapes metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-gateway-ingress
  namespace: eurobase
spec:
  podSelector:
    matchLabels:
      app: pgbouncer-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: pgbouncer-smoke
      ports:
        - protocol: TCP
          port: 6432
    - from:
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - protocol: TCP
          port: 9127
