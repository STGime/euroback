# PgBouncer for the gateway (#651) — separate from the runner's pooler
# (pgbouncer.yaml) so client capacity reachable from tenant function code
# is never the gateway's: only gateway pods may connect, and the functions
# egress policy only allows `app: pgbouncer`.
#
# Platform roles only (PGB_INCLUDE_TENANTS=0): the gateway role now; the
# developer role in PR 4 (PGB_INCLUDE_DEVELOPER=1). No tenant roles, no
# FUNC_PASSWORD_SECRET. Unused until PR 4 routes the gateway's pools here;
# pools open lazily, so it holds no server connections until then.
#
# Budget (PR 4): PGB_MAX_DB_CONNECTIONS per replica × 2 comes on top of the
# budget — shrink the gateway's direct pools as they move (AGENTS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-gateway
  namespace: eurobase
  labels:
    app: pgbouncer-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer-gateway
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: pgbouncer-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: render
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer-userlist", "init"]
          env: &pgbEnv
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: eurobase-secrets, key: DATABASE_URL } }
            - name: PGB_UPSTREAM_URL_VAR
              value: DATABASE_URL
            - name: PGB_PLATFORM_URL_VARS
              value: DATABASE_URL
            - name: PGB_INCLUDE_TENANTS
              value: "0"
            - name: PGB_DIR
              value: /run/pgbouncer
            - name: PGB_SERVER_TLS
              value: require
            - name: PGB_MAX_DB_CONNECTIONS
              value: "10"
            - name: PGB_POOL_SIZE_EUROBASE_GATEWAY
              value: "10"
          volumeMounts:
            - { name: run, mountPath: /run/pgbouncer }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: pgbouncer
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer", "/run/pgbouncer/pgbouncer.ini"]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5; kill -INT $(pidof pgbouncer); while pidof pgbouncer >/dev/null; do sleep 1; done"]
          ports:
            - { name: pgbouncer, containerPort: 6432 }
          readinessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6432 }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - { name: run, mountPath: /run/pgbouncer }
          securityContext: *restricted
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: userlist
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer-userlist", "sync"]
          ports:
            - { name: metrics, containerPort: 9127 }
          env: *pgbEnv
          volumeMounts:
            - { name: run, mountPath: /run/pgbouncer }
          securityContext: *restricted
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      imagePullSecrets:
        - name: scw-registry
      volumes:
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-gateway
  namespace: eurobase
  labels:
    app: pgbouncer-gateway
spec:
  selector:
    app: pgbouncer-gateway
  ports:
    - { name: pgbouncer, port: 6432, targetPort: 6432 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-gateway
  namespace: eurobase
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer-gateway
---
# Only the gateway (and the ops smoke test) may connect; Alloy scrapes metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-gateway-ingress
  namespace: eurobase
spec:
  podSelector:
    matchLabels:
      app: pgbouncer-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: pgbouncer-smoke
      ports:
        - protocol: TCP
          port: 6432
    - from:
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - protocol: TCP
          port: 9127
