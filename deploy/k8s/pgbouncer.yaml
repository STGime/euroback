# PgBouncer for the functions runner's tenant connections (#641 PR 2/3;
# runner-only since #651 — the gateway has pgbouncer-gateway.yaml).
#
# Transaction pooling; authenticates every client itself against a
# generated userlist (platform roles + one derived SCRAM verifier per
# tenant `<schema>_func` role — SCRAM passes through to Postgres, so the
# pooler never holds a tenant's plaintext password). Config and userlist
# are rendered by `pgbouncer-userlist` (cmd/pgbouncer-userlist):
#   - init container `render`: pgbouncer.ini + userlist.txt
#   - sidecar `userlist`: re-renders every 10 s, SIGHUPs pgbouncer on
#     change (new projects become poolable within seconds)
#
# PR 3: the functions runner's tenant connections (ctx.db.sql) go through
# it, via the tenant alias `eurobase_tenant`. PR 4 (gateway) needs a
# separate pooler deployment first (AGENTS.md).
# Never route through it: golang-migrate, tenant `_ddl` apply
# connections, the worker (River LISTEN) — see AGENTS.md § Connection
# pooling prerequisites.
#
# Budget per replica: platform alias 10, tenant alias 15 server connections
# (× 2 replicas); pools open lazily, so an idle pooler holds none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: eurobase
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  strategy:
    # No surge pod: its max_db_connections would come on top of the
    # budget. With 2 replicas one always stays up (PDB minAvailable 1).
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: pgbouncer
      annotations:
        # userlist sidecar exposes pool stats (#651) for Alloy → Cockpit.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      # The userlist sidecar SIGHUPs the pgbouncer process on change. With
      # no secrets in the pod (#653) the shared namespace exposes nothing
      # beyond the verifiers pgbouncer already holds.
      shareProcessNamespace: true
      serviceAccountName: pgbouncer-runner
      automountServiceAccountToken: false
      # preStop waits for in-flight transactions: tenant statement_timeout
      # is the invocation budget (60 s on Pro), + preStop sleep + margin.
      # Only rolls when the pooler's own inputs change (content-tagged
      # image in CI).
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: render
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer-userlist", "init"]
          env: &pgbEnv
            # The runner's pooler (#651, #653): tenant roles only and NO
            # secrets at all in this pod — user code can reach it. The
            # tenant verifiers and the upstream address are published by
            # the worker to the Secret below (read-only via the projected
            # service-account token); no FUNC_PASSWORD_SECRET, no DB URL.
            - name: PGB_TENANT_SOURCE
              value: k8s-secret:pgbouncer-tenant-userlist
            - name: PGB_PLATFORM_URL_VARS
              value: ""
            - name: PGB_DIR
              value: /run/pgbouncer
            - name: PGB_SERVER_TLS
              value: require
            # Server connections per replica. The platform alias serves no
            # role here (only the stats user reaches the admin console).
            - name: PGB_MAX_DB_CONNECTIONS
              value: "1"
            - name: PGB_TENANT_MAX_DB_CONNECTIONS
              value: "15"
            - name: PGB_TENANT_POOL_SIZE
              value: "2"
            # Keep equal to spec.replicas (tenant connection budget check).
            - name: PGB_REPLICAS
              value: "2"
          volumeMounts: &saMounts
            - { name: run, mountPath: /run/pgbouncer }
            - { name: sa, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: pgbouncer
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer", "/run/pgbouncer/pgbouncer.ini"]
          # Graceful stop: wait for the endpoint removal to propagate, then
          # SIGINT = "safe shutdown" (finish in-flight transactions, then
          # exit). Kubernetes' SIGTERM would be "super safe" (wait for
          # clients to disconnect), which pooled clients never do.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5; kill -INT $(pidof pgbouncer); while pidof pgbouncer >/dev/null; do sleep 1; done"]
          ports:
            - { name: pgbouncer, containerPort: 6432 }
          readinessProbe:
            tcpSocket: { port: 6432 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6432 }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - { name: run, mountPath: /run/pgbouncer }
          securityContext: *restricted
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: userlist
          image: rg.fr-par.scw.cloud/eurobase-app/pgbouncer:latest
          command: ["pgbouncer-userlist", "sync"]
          ports:
            - { name: metrics, containerPort: 9127 }
          env: *pgbEnv
          volumeMounts: *saMounts
          securityContext: *restricted
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        # Service-account token for the render/userlist containers only
        # (get on pgbouncer-tenant-userlist); not mounted into pgbouncer.
        - name: sa
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: eurobase
  labels:
    app: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
    - { name: pgbouncer, port: 6432, targetPort: 6432 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: eurobase
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
---
# The runner's pooler: only the functions runner and the ops smoke test may
# connect (the gateway has its own pooler, pgbouncer-gateway.yaml); Alloy
# scrapes the sidecar's metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-ingress
  namespace: eurobase
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: functions
        # scripts/ops/pgbouncer-smoke.sh (one-off verification pod)
        - podSelector:
            matchLabels:
              app: pgbouncer-smoke
      ports:
        - protocol: TCP
          port: 6432
    - from:
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - protocol: TCP
          port: 9127
