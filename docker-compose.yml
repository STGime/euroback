services:
  postgres:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eurobase
      # Built-in superuser is NOT eurobase_api: migration 000037 REASSIGNs
      # everything owned by eurobase_api, which PostgreSQL refuses for the
      # bootstrap superuser. scripts/db/apply-migrations.sh creates
      # eurobase_api (password localdev) and the runtime roles (#632).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eurobase"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eurobase_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eurobase_pgdata:
