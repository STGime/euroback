services:
  postgres:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eurobase
      # Built-in superuser is NOT eurobase_api: migration 000037 REASSIGNs
      # everything owned by eurobase_api, which PostgreSQL refuses for the
      # bootstrap superuser. scripts/db/apply-migrations.sh creates
      # eurobase_api (password localdev) and the runtime roles (#632).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eurobase"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eurobase_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 for local dev: Garage (Deuxfleurs, EU). MinIO no longer publishes
  # community images to Docker Hub. scripts/setup-local.sh creates the
  # layout and the dev key (see its output for the credentials).
  garage:
    image: dxflrs/garage:v1.1.0@sha256:fdb8272fcbe643eef830ee17874d5d4ed623a86501f1acbac8012583113b1c26
    ports:
      - "9000:3900"
    volumes:
      - ./deploy/local/garage.toml:/etc/garage.toml:ro
      - eurobase_garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eurobase_pgdata:
  eurobase_garage:
